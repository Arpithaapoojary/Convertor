name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare public directory
        run: |
          set -e
          rm -rf public || true
          mkdir -p public
          # copy only the site assets to keep published branch clean
          if [ -f index.html ]; then cp index.html public/; fi
          if [ -d css ]; then cp -r css public/; fi
          if [ -d js ]; then cp -r js public/; fi
          if [ -d images ]; then cp -r images public/ || true; fi
          echo "Public directory contents:"; ls -la public || true

      - name: Debug: show repo root files
        run: |
          echo "Repository root files:"; ls -la || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
          user_name: 'DocSuite Bot'
          user_email: 'noreply@github.com'
